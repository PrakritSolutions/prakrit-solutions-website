name: CI

on:
  push:
    branches: [preview, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Next generates the PageProps and LayoutProps types; a fresh checkout has none yet.
      - name: Generate route types
        run: npx next typegen
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production dependencies have no high or critical advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
